name: Feature request
description: Suggest an idea for DocBunker.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: security-relevant
    attributes:
      label: Does this touch the sandbox boundary or trust model?
      description: >
        If yes, the change will need an ADR (see CONTRIBUTING.md) and a
        threat-model review before it can be merged.
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true
