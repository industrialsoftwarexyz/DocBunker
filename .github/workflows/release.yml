name: release

# Builds unsigned desktop bundles for all three platforms when a version tag
# is pushed (or on demand), then attaches them plus checksums and a source
# SBOM to a *draft* GitHub Release for human review before publishing.
#
# Known gap (see CHANGELOG "Known limitations"): the QEMU kernel and initramfs
# for the VM backend cannot be rebuilt here because they require reviewed
# upstream artifacts (kernel source tree, static runsc, busybox) supplied
# manually via sandbox/scripts/build-vm-assets.sh. Bundles from this workflow
# need those two files placed next to the app binary — or DOCBUNKER_VM_KERNEL /
# DOCBUNKER_VM_INITRD set — before distribution.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            bundles: nsis,msi
          - label: macos
            os: macos-latest
            bundles: app,dmg
          - label: linux-x64
            os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Respects the pinned toolchain in rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Restore frontend dependencies
        run: npm --prefix frontend ci

      - name: Build bundles (${{ matrix.bundles }})
        run: npm --prefix frontend exec tauri -- build --bundles ${{ matrix.bundles }}

      - name: Collect bundle paths (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "bundle_glob=target/release/bundle/{nsis/*.exe,msi/*.msi}" >> "$GITHUB_ENV"

      - name: Collect bundle paths (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "bundle_glob=target/release/bundle/dmg/*.dmg" >> "$GITHUB_ENV"

      - name: Collect bundle paths (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: echo "bundle_glob=target/release/bundle/{deb/*.deb,appimage/*.AppImage}" >> "$GITHUB_ENV"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docbunker-${{ matrix.label }}
          path: ${{ env.bundle_glob }}
          if-no-files-found: error

  publish:
    name: draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and artifact SBOM
        shell: bash
        run: |
          cd dist
          find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z \
            | xargs -0 sha256sum -b > SHA256SUMS.txt
          curl -sSfL https://get.anchore.io/syft | sh -s -- -b /usr/local/bin
          syft dir:. -o spdx-json > docbunker-sbom.spdx.json
          ls -la

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/**
