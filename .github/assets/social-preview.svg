<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- DocBunker social preview (1280x640).
       Convert to PNG and upload via: Repo Settings -> General -> Social preview -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16212c"/>
      <stop offset="1" stop-color="#223140"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d6efd"/>
      <stop offset="1" stop-color="#6ea8fe"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- faint document lines, echoing the logo -->
  <g fill="#2b3947">
    <rect x="880" y="-20" width="560" height="46" rx="14" transform="rotate(4 880 -20)"/>
    <rect x="880" y="150" width="560" height="46" rx="14" transform="rotate(4 880 150)"/>
    <rect x="880" y="320" width="560" height="46" rx="14" transform="rotate(4 880 320)"/>
    <rect x="880" y="490" width="560" height="46" rx="14" transform="rotate(4 880 490)"/>
  </g>

  <!-- shield + lock mark -->
  <g transform="translate(96,150)">
    <path d="M110 0 L210 33 V120 c0 66-41 113-100 144 C51 233 10 186 10 120 V33 z" fill="#0d6efd"/>
    <path d="M110 26 L184 52 V118 c0 50-31 85-74 108 C67 203 36 168 36 118 V52 z" fill="#f4f7fb"/>
    <rect x="76" y="98" width="68" height="54" rx="11" fill="#0d6efd"/>
    <path d="M89 98 v-16 a21 21 0 0 1 42 0 v16" stroke="#0d6efd" stroke-width="13" fill="none"/>
  </g>

  <!-- wordmark -->
  <text x="380" y="290" font-family="'Segoe UI', Arial, sans-serif" font-size="104"
        font-weight="700" fill="#f4f7fb">DocBunker</text>

  <rect x="384" y="330" width="330" height="8" rx="4" fill="url(#accent)"/>

  <text x="380" y="408" font-family="'Segoe UI', Arial, sans-serif" font-size="44"
        fill="#b9c6d4">Open untrusted documents safely.</text>

  <text x="380" y="472" font-family="'Segoe UI', Arial, sans-serif" font-size="30"
        fill="#7d8fa1">Parsed in a disposable gVisor / QEMU sandbox - only validated pixels reach your screen.</text>

  <!-- footer -->
  <text x="96" y="586" font-family="'Segoe UI', Arial, sans-serif" font-size="28"
        fill="#5d7085">Rust - Tauri - gVisor - QEMU</text>
  <text x="1184" y="586" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif"
        font-size="28" fill="#5d7085">github.com/industrialsoftwarexyz/DocBunker</text>
</svg>
