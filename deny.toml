# cargo-deny policy. See https://embarkstudios.github.io/cargo-deny/
[advisories]
yanked = "deny"
# Same documented exceptions as audit.toml: unmaintained transitive crates
# only (no vulnerability-class advisory is ignored).
ignore = [
    # ttf-parser, via fontdue; parses only the embedded static font.
    "RUSTSEC-2026-0192",
    # gtk-rs 0.18 stack, via Tauri on Linux.
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    "RUSTSEC-2024-0429",
    # unmaintained `unic-*` family, via tauri-utils.
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace members reference each other by path (no version requirement),
# which the wildcard check would otherwise count as a wildcard dependency.
allow-wildcard-paths = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "OpenSSL",
    "MPL-2.0",
    # target-lexicon (build-dependency of the gtk-sys stack)
    "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.8
# MuPDF is only reachable behind the opt-in pdf-mupdf feature, so its AGPL
# exception and some permissive licenses may not appear in a default-graph
# scan; do not fail on entries that were not encountered.
unused-allowed-license = "allow"
unused-license-exception = "allow"

# The `pdf-mupdf` cargo feature (OFF by default) links MuPDF into the worker
# binary, making that binary AGPL-3.0. DocBunker itself is MIT; the default
# build never pulls these crates. See ADR-005. CI builds the feature in the
# dedicated `pdf-mupdf` job only, which does not run cargo-deny.
[[licenses.exceptions]]
name = "mupdf"
version = "0.7"
allow = ["AGPL-3.0"]

[[licenses.exceptions]]
name = "mupdf-sys"
version = "0.8"
allow = ["AGPL-3.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
