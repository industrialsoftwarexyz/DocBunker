# cargo-deny policy. See https://embarkstudios.github.io/cargo-deny/
[advisories]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "OpenSSL",
    "MPL-2.0",
]
confidence-threshold = 0.8

# The `pdf-mupdf` cargo feature (OFF by default) links MuPDF into the worker
# binary, making that binary AGPL-3.0. DocBunker itself is MIT; the default
# build never pulls these crates. See ADR-005. CI builds the feature in the
# dedicated `pdf-mupdf` job only, which does not run cargo-deny.
[[licenses.exceptions]]
name = "mupdf"
version = "0.7"
allow = ["AGPL-3.0"]

[[licenses.exceptions]]
name = "mupdf-sys"
version = "0.8"
allow = ["AGPL-3.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
