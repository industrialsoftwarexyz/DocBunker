# cargo-deny policy. See https://embarkstudios.github.io/cargo-deny/
[advisories]
version = 2
yanked = "deny"
ignore = []

[bans]
version = 2
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "OpenSSL",
    "MPL-2.0",
]
confidence-threshold = 0.8
copyleft = "deny"

# The `pdf-mupdf` cargo feature (OFF by default) links MuPDF into the worker
# binary, making that binary AGPL-3.0. DocBunker itself is MIT; the default
# build never pulls these crates. See ADR-005. CI builds the feature in the
# dedicated `pdf-mupdf` job only, which does not run cargo-deny.
[licenses.exceptions]
mupdf = { name = "mupdf", version = "0.7", allow = ["AGPL-3.0"] }
mupdf-sys = { name = "mupdf-sys", version = "0.8", allow = ["AGPL-3.0"] }

[sources]
version = 2
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
