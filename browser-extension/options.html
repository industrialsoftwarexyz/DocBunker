<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DocBunker options</title>
    <style>
      body { width: 320px; padding: 18px; font: 13px "Segoe UI", sans-serif; color: #222; }
      h1 { margin: 0 0 14px; font-size: 18px; font-weight: 500; color: #164a73; }
      label { display: flex; gap: 9px; align-items: flex-start; line-height: 1.45; }
      p { color: #59636c; line-height: 1.45; }
    </style>
  </head>
  <body>
    <h1>DocBunker</h1>
    <label>
      <input id="delete-after-open" type="checkbox" />
      Delete the downloaded copy after DocBunker confirms that it opened successfully.
    </label>
    <p>The document remains available inside DocBunker only for the current isolated session.</p>
    <script src="options.js"></script>
  </body>
</html>
