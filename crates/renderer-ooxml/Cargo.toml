[package]
name = "docbunker-renderer-ooxml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "OOXML (docx/pptx/xlsx) text-preview renderer for the DocBunker worker (ADR-007)"

[lints]
workspace = true

[dev-dependencies]
# Used only to generate image fixtures in tests (ADR-008).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[dependencies]
docbunker-renderer-api = { path = "../renderer-api" }
docbunker-renderer-image = { path = "../renderer-image" }
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
fontdue = "0.9"
tracing = { workspace = true }
